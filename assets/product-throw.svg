<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8" />
      <stop offset="100%" stop-color="#dbd2c2" />
    </linearGradient>
    <linearGradient id="cloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ebdcc5" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc28e" />
      <stop offset="100%" stop-color="#c9a96e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#70503e" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />

  <ellipse cx="200" cy="420" rx="80" ry="12" fill="#70503e" opacity="0.15" filter="blur(6px)" />

  <!-- Draped/Folded Throw Blanket -->
  <g filter="url(#shadow)">
    <!-- Ladder/Drape stand -->
    <line x1="130" y1="100" x2="130" y2="430" stroke="#7a6e60" stroke-width="5" stroke-linecap="round" />
    <line x1="270" y1="100" x2="270" y2="430" stroke="#7a6e60" stroke-width="5" stroke-linecap="round" />
    
    <!-- Ladder Rungs -->
    <line x1="130" y1="150" x2="270" y2="150" stroke="#7a6e60" stroke-width="4" />
    <line x1="130" y1="240" x2="270" y2="240" stroke="#7a6e60" stroke-width="4" />
    <line x1="130" y1="330" x2="270" y2="330" stroke="#7a6e60" stroke-width="4" />

    <!-- Blanket folded over middle rung -->
    <path d="M 150 240
             C 150 200, 250 200, 250 240
             L 255 380 
             C 255 390, 245 395, 235 390
             L 230 255
             L 225 395
             C 225 400, 215 405, 205 400
             L 200 255
             L 195 405
             C 195 410, 185 415, 175 410
             L 170 255
             L 165 390
             C 165 395, 150 390, 150 380 Z" 
          fill="url(#cloth)" stroke="url(#gold)" stroke-width="1.5" />
          
    <!-- Grid texture on blanket -->
    <path d="M 160 250 Q 165 310, 160 380
             M 180 250 Q 185 310, 180 390
             M 200 250 Q 205 310, 200 395
             M 220 250 Q 225 310, 220 390
             M 240 250 Q 245 310, 240 375" 
          fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.4" />
          
    <path d="M 152 270 L 248 270
             M 152 300 L 248 300
             M 152 330 L 248 330
             M 152 360 L 248 360" 
          fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.4" />
          
    <!-- Fringe details at bottom -->
    <path d="M 152 380 L 152 390
             M 158 380 L 158 390
             M 164 380 L 164 390
             M 172 410 L 172 420
             M 178 410 L 178 420
             M 184 410 L 184 420
             M 197 405 L 197 415
             M 203 405 L 203 415
             M 209 405 L 209 415
             M 222 395 L 222 405
             M 228 395 L 228 405
             M 234 395 L 234 405
             M 247 390 L 247 400
             M 253 390 L 253 400" 
          stroke="url(#gold)" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Text Label -->
  <text x="200" y="470" font-family="'Playfair Display', serif" font-size="14" font-weight="500" fill="#1a1008" letter-spacing="2" text-anchor="middle" opacity="0.8">NOMA THROW</text>
</svg>
