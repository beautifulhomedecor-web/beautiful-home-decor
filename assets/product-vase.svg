<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5efe5" />
      <stop offset="100%" stop-color="#d4c5b2" />
    </linearGradient>
    <linearGradient id="vase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f7f3ed" />
      <stop offset="100%" stop-color="#ebdcc5" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc28e" />
      <stop offset="100%" stop-color="#c9a96e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#70503e" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />
  
  <!-- Abstract graphic pattern in background -->
  <circle cx="200" cy="250" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
  
  <!-- Shadow for the vase -->
  <ellipse cx="200" cy="410" rx="60" ry="12" fill="#70503e" opacity="0.15" filter="blur(8px)" />

  <!-- Sculptural Vase -->
  <path d="M 170 120 
           C 160 120, 140 180, 140 240 
           C 140 330, 150 400, 200 400 
           C 250 400, 260 330, 260 240 
           C 260 180, 240 120, 230 120 Z" 
        fill="url(#vase)" filter="url(#shadow)" stroke="url(#gold)" stroke-width="1.5" />
        
  <!-- Fluted/ridged lines on the vase -->
  <path d="M 180 122 C 175 200, 175 320, 200 398" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4" />
  <path d="M 200 122 C 200 200, 200 320, 200 398" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5" />
  <path d="M 220 122 C 225 200, 225 320, 200 398" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4" />

  <!-- Botanical branch inside vase -->
  <path d="M 200 120 Q 220 50, 270 30" fill="none" stroke="#7a6e60" stroke-width="2" stroke-linecap="round" />
  <path d="M 200 120 Q 180 60, 140 50" fill="none" stroke="#7a6e60" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Leaves -->
  <path d="M 240 43 C 245 35, 255 35, 255 43 C 255 51, 245 51, 240 43 Z" fill="url(#gold)" opacity="0.9" />
  <path d="M 270 30 C 275 22, 285 22, 285 30 C 285 38, 275 38, 270 30 Z" fill="url(#gold)" opacity="0.9" />
  <path d="M 160 55 C 155 48, 145 48, 145 55 C 145 62, 155 62, 160 55 Z" fill="url(#gold)" opacity="0.9" />
  <path d="M 180 75 C 175 68, 165 68, 165 75 C 165 82, 175 82, 180 75 Z" fill="url(#gold)" opacity="0.9" />

  <!-- Text Label -->
  <text x="200" y="470" font-family="'Playfair Display', serif" font-size="14" font-weight="500" fill="#1a1008" letter-spacing="2" text-anchor="middle" opacity="0.8">ARIA VASE</text>
</svg>
