<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ddd0" />
      <stop offset="100%" stop-color="#c9bb9e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc28e" />
      <stop offset="100%" stop-color="#c9a96e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#70503e" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="250" fill="url(#bg)" />

  <g filter="url(#shadow)">
    <!-- Abstract circular patterns representing pottery lines / rings -->
    <circle cx="200" cy="125" r="90" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
    <circle cx="200" cy="125" r="70" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <circle cx="200" cy="125" r="50" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
    
    <!-- Sculptural clay block / geometry -->
    <rect x="165" y="85" width="70" height="80" rx="5" fill="#faf6f0" opacity="0.85" stroke="url(#gold)" stroke-width="1.5" />
    
    <!-- Curved line showing hand carving/shaping -->
    <path d="M 175 100 Q 200 130, 225 100" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" />
    <path d="M 180 120 Q 200 145, 220 120" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 185 140 Q 200 160, 215 140" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <text x="20" y="35" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="url(#gold)" letter-spacing="1">CRAFTSMANSHIP</text>
</svg>
