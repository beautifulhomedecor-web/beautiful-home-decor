<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede5d8" />
      <stop offset="100%" stop-color="#cec0a8" />
    </linearGradient>
    <linearGradient id="cushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8ddd0" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc28e" />
      <stop offset="100%" stop-color="#c9a96e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#70503e" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />

  <!-- Shadow under the chair -->
  <ellipse cx="200" cy="425" rx="90" ry="15" fill="#70503e" opacity="0.2" filter="blur(10px)" />

  <!-- Lounge Chair Line-art/Design -->
  <g filter="url(#shadow)">
    <!-- Back legs / support -->
    <line x1="150" y1="280" x2="130" y2="420" stroke="#7a6e60" stroke-width="6" stroke-linecap="round" />
    <line x1="250" y1="280" x2="270" y2="420" stroke="#7a6e60" stroke-width="6" stroke-linecap="round" />

    <!-- Front legs -->
    <line x1="160" y1="340" x2="170" y2="430" stroke="#1a1008" stroke-width="7" stroke-linecap="round" />
    <line x1="240" y1="340" x2="230" y2="430" stroke="#1a1008" stroke-width="7" stroke-linecap="round" />

    <!-- Wooden side armrest / frame -->
    <path d="M 110 230 C 110 200, 140 180, 180 180" fill="none" stroke="#7a6e60" stroke-width="8" stroke-linecap="round" />
    <path d="M 120 280 L 160 340 L 290 310" fill="none" stroke="#1a1008" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 280 280 L 240 340 L 110 310" fill="none" stroke="#1a1008" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.3" />

    <!-- Cushion backrest -->
    <path d="M 160 170 C 150 170, 130 220, 130 280 C 130 310, 270 310, 270 280 C 270 220, 250 170, 240 170 Z" fill="url(#cushion)" stroke="url(#gold)" stroke-width="1.5" />
    
    <!-- Cushion seat -->
    <path d="M 130 300 C 130 280, 140 270, 200 270 C 260 270, 270 280, 270 300 C 270 340, 260 350, 200 350 C 140 350, 130 340, 130 300 Z" fill="url(#cushion)" stroke="url(#gold)" stroke-width="2" />
  </g>

  <!-- Text Label -->
  <text x="200" y="470" font-family="'Playfair Display', serif" font-size="14" font-weight="500" fill="#1a1008" letter-spacing="2" text-anchor="middle" opacity="0.8">SERENO CHAIR</text>
</svg>
