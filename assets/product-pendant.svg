<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede4d5" />
      <stop offset="100%" stop-color="#cec2a8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc28e" />
      <stop offset="100%" stop-color="#c9a96e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffedd0" />
      <stop offset="100%" stop-color="#ffedd0" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#70503e" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />

  <!-- Bulb glow background -->
  <circle cx="200" cy="275" r="90" fill="url(#glow)" opacity="0.8" filter="blur(8px)" />

  <g filter="url(#shadow)">
    <!-- Hanging cord -->
    <line x1="200" y1="0" x2="200" y2="190" stroke="#1a1008" stroke-width="2.5" />
    
    <!-- Cord collar -->
    <rect x="194" y="185" width="12" height="15" rx="2" fill="#1a1008" />
    <path d="M 185 200 L 215 200 L 210 215 L 190 215 Z" fill="url(#gold)" />
    
    <!-- Woven Rattan Outer Shade -->
    <path d="M 190 210 L 210 210
             C 240 210, 290 240, 290 280
             C 290 320, 260 340, 250 340
             L 150 340
             C 140 340, 110 320, 110 280
             C 110 240, 160 210, 190 210 Z" 
          fill="rgba(255, 255, 255, 0.15)" stroke="url(#gold)" stroke-width="2.5" />
          
    <!-- Concentric woven patterns (horizontal) -->
    <path d="M 130 250 Q 200 240, 270 250
             M 115 280 Q 200 270, 285 280
             M 125 310 Q 200 300, 275 310" 
          fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6" />
          
    <!-- Woven ribs (vertical) -->
    <path d="M 190 210 Q 150 250, 140 340
             M 195 210 Q 175 250, 170 340
             M 200 210 Q 200 250, 200 340
             M 205 210 Q 225 250, 230 340
             M 210 210 Q 250 250, 260 340" 
          fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.6" />

    <!-- Exposed Light Bulb inside -->
    <circle cx="200" cy="275" r="22" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8" />
    <circle cx="200" cy="275" r="8" fill="#ffffff" />
  </g>

  <!-- Text Label -->
  <text x="200" y="470" font-family="'Playfair Display', serif" font-size="14" font-weight="500" fill="#1a1008" letter-spacing="2" text-anchor="middle" opacity="0.8">SORA PENDANT</text>
</svg>
