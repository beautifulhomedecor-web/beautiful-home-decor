<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ece4d6" />
      <stop offset="100%" stop-color="#cec2a8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc28e" />
      <stop offset="100%" stop-color="#c9a96e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#70503e" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="250" fill="url(#bg)" />

  <ellipse cx="200" cy="210" rx="45" ry="6" fill="#70503e" opacity="0.15" filter="blur(4px)" />

  <g filter="url(#shadow)">
    <!-- Base surface line -->
    <line x1="80" y1="210" x2="320" y2="210" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Ceramic Cup/Vase -->
    <path d="M 185 150 L 215 150 L 210 210 L 190 210 Z" fill="#faf6f0" stroke="url(#gold)" stroke-width="1.2" />
    
    <!-- Botanical Branch (Wabi Sabi Twig) -->
    <path d="M 200 150 Q 215 110, 240 80 Q 260 50, 290 40" fill="none" stroke="#3d3226" stroke-width="2" stroke-linecap="round" />
    <path d="M 218 120 Q 200 90, 180 80" fill="none" stroke="#3d3226" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 235 88 Q 240 65, 225 50" fill="none" stroke="#3d3226" stroke-width="1.5" stroke-linecap="round" />

    <!-- Dead/Dry leaves -->
    <path d="M 290 40 C 295 33, 303 33, 303 40 C 303 47, 295 47, 290 40 Z" fill="url(#gold)" />
    <path d="M 180 80 C 175 75, 168 75, 168 80 C 168 85, 175 85, 180 80 Z" fill="url(#gold)" />
    <path d="M 225 50 C 220 45, 213 45, 213 50 C 213 55, 220 55, 225 50 Z" fill="url(#gold)" />
  </g>
  
  <text x="20" y="35" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="url(#gold)" letter-spacing="1">PHILOSOPHY</text>
</svg>
