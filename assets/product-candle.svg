<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e8dc" />
      <stop offset="100%" stop-color="#d4c8b2" />
    </linearGradient>
    <linearGradient id="jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d3226" />
      <stop offset="50%" stop-color="#2d2418" />
      <stop offset="100%" stop-color="#1c140c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc28e" />
      <stop offset="100%" stop-color="#c9a96e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ffdda3" />
      <stop offset="100%" stop-color="#ffdda3" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#70503e" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />

  <!-- Background aura/glow -->
  <circle cx="200" cy="200" r="100" fill="url(#glow)" opacity="0.8" filter="blur(8px)" />

  <!-- Shadow under the candle -->
  <ellipse cx="200" cy="410" rx="55" ry="10" fill="#70503e" opacity="0.2" filter="blur(6px)" />

  <!-- Stoneware Jar Candle -->
  <g filter="url(#shadow)">
    <!-- Wax inside jar (visible rim) -->
    <ellipse cx="200" cy="280" rx="48" ry="10" fill="#fcf9f5" stroke="url(#gold)" stroke-width="1.5" />
    
    <!-- Outer glass/stoneware jar structure -->
    <path d="M 150 280 L 150 390 C 150 410, 250 410, 250 390 L 250 280 Z" fill="url(#jar)" />
    
    <!-- Lid/opening edge -->
    <ellipse cx="200" cy="280" rx="50" ry="11" fill="none" stroke="url(#gold)" stroke-width="1.5" />
    
    <!-- Minimalist Label on jar -->
    <rect x="175" y="315" width="50" height="45" rx="3" fill="#faf6f0" stroke="url(#gold)" stroke-width="0.75" />
    <line x1="183" y1="330" x2="217" y2="330" stroke="#1a1008" stroke-width="1" />
    <line x1="187" y1="337" x2="213" y2="337" stroke="#1a1008" stroke-width="0.75" />
    <line x1="192" y1="344" x2="208" y2="344" stroke="#1a1008" stroke-width="0.75" />
    
    <!-- Wick -->
    <line x1="200" y1="280" x2="200" y2="265" stroke="#1a1008" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Candle Flame -->
    <path d="M 200 265 Q 206 250, 200 230 Q 194 250, 200 265 Z" fill="url(#gold)" />
    <path d="M 200 262 Q 203 252, 200 242 Q 197 252, 200 262 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Text Label -->
  <text x="200" y="470" font-family="'Playfair Display', serif" font-size="14" font-weight="500" fill="#1a1008" letter-spacing="2" text-anchor="middle" opacity="0.8">MORI CANDLE</text>
</svg>
