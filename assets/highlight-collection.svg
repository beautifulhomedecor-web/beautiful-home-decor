<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5d9c8" />
      <stop offset="50%" stop-color="#d4c5b2" />
      <stop offset="100%" stop-color="#c7b8a2" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc28e" />
      <stop offset="100%" stop-color="#c9a96e" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c2c2" />
      <stop offset="100%" stop-color="#d4a0a0" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.20)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#5a4230" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" />

  <!-- Abstract warm glowing sun in background -->
  <circle cx="150" cy="250" r="180" fill="url(#gold)" opacity="0.18" filter="blur(40px)" />
  <circle cx="450" cy="550" r="150" fill="url(#rose)" opacity="0.15" filter="blur(30px)" />

  <!-- Base platform -->
  <ellipse cx="300" cy="630" rx="160" ry="25" fill="#5a4230" opacity="0.15" filter="blur(8px)" />
  <path d="M 140 630 L 460 630 L 440 650 L 160 650 Z" fill="url(#gold)" opacity="0.6" />

  <!-- Stacked Abstract Glass Prisms and Sculpture (Minimalist Solstice Art) -->
  <g filter="url(#shadow)">
    <!-- Column 1 (Terrazzo / Stone Block) -->
    <rect x="200" y="380" width="80" height="250" rx="10" fill="#faf6f0" opacity="0.9" stroke="url(#gold)" stroke-width="1.5" />
    <line x1="240" y1="380" x2="240" y2="630" stroke="url(#gold)" stroke-width="0.75" opacity="0.4" />
    
    <!-- Sphere (Marble / Onyx) sitting on block -->
    <circle cx="240" cy="330" r="45" fill="url(#rose)" stroke="url(#gold)" stroke-width="1.5" />
    <path d="M 220 310 Q 250 300, 270 340" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round" />

    <!-- Glass Fluted Arch (overlapping column) -->
    <path d="M 260 630 L 260 270 C 260 210, 360 210, 360 270 L 360 630 Z" 
          fill="url(#glass)" stroke="#ffffff" stroke-width="2" />
          
    <!-- Glass fluted ridges -->
    <path d="M 280 260 L 280 630" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <path d="M 300 245 L 300 630" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <path d="M 320 245 L 320 630" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <path d="M 340 260 L 340 630" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    
    <!-- Small Brass/Gold Ring in front of sculpture -->
    <circle cx="300" cy="520" r="30" fill="none" stroke="url(#gold)" stroke-width="6" />
    <circle cx="300" cy="520" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- ✦ Decorative Star in sky -->
  <path d="M 150 140 L 152 147 L 160 147 L 153 151 L 156 159 L 150 154 L 144 159 L 147 151 L 140 147 L 148 147 Z" fill="url(#gold)" opacity="0.7" />
  
  <!-- Subtle line accents -->
  <path d="M 80 700 L 520 700" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  
  <!-- Title details -->
  <text x="300" y="745" font-family="'Playfair Display', serif" font-size="20" font-weight="500" fill="#1a1008" letter-spacing="4" text-anchor="middle" opacity="0.8">THE SOLSTICE EDIT</text>
</svg>
